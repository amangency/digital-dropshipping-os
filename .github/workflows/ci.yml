name: Funnel Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: web-engine/package.json

    - name: Install Dependencies
      working-directory: ./web-engine
      run: npm ci

    - name: TypeScript Type Check
      working-directory: ./web-engine
      run: npm run lint

    - name: Build Web Engine & Server
      working-directory: ./web-engine
      run: npm run build
